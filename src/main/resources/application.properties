# spring.config.import=optional:file:dev.env[.properties]

spring.application.name=spring-gift
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:gift
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

#spring.sql.init.schema-locations=schema.sql
#spring.sql.init.data-locations=data.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.mode=always

